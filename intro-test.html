<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro Test — Scroll Scrub</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --white: #f0ede8;
      --black: #050505;
      --gray: #888;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Georgia', serif;
    }

    /* The scroll container defines how much scroll distance the video spans.
       Taller = slower scrub. */
    #scrub-section {
      position: relative;
      height: 400vh; /* 4 screens of scroll to play through the whole video */
    }

    /* The video is pinned to the viewport while we scroll through the section */
    #video-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
    }

    #scrub-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Scroll hint */
    .scroll-hint {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
      transition: opacity 0.4s;
    }

    .scroll-hint span {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--gray);
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: scrollPulse 1.8s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }

    /* Progress bar to visualize scrub position (debug/feel aid) */
    #progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: var(--gold);
      z-index: 20;
    }

    /* What comes AFTER the intro */
    #after {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1rem;
      padding: 2rem;
    }

    #after h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    #after p {
      color: var(--gray);
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="progress"></div>

  <!-- ── SCROLL-SCRUBBED INTRO ── -->
  <div id="scrub-section">
    <div id="video-stage">
      <!-- Placeholder video. Swap src with the Seedance 2 logo→watch pull-back clip.
           Must be muted + playsinline for scrubbing to work on all browsers. -->
      <video id="scrub-video" muted playsinline preload="auto"
             src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    </div>

    <div class="scroll-hint" id="hint">
      <span>Scroll to reveal</span>
      <div class="scroll-line"></div>
    </div>
  </div>

  <!-- ── AFTER THE INTRO ── -->
  <div id="after">
    <h1>The watch is now revealed.</h1>
    <p>Scroll up — the video runs backward.</p>
  </div>

  <script>
    const section  = document.getElementById('scrub-section');
    const video    = document.getElementById('scrub-video');
    const progress = document.getElementById('progress');
    const hint     = document.getElementById('hint');

    let videoReady = false;
    let targetTime = 0;
    let currentTime = 0;

    // Wait until we know the video duration
    video.addEventListener('loadedmetadata', () => {
      videoReady = true;
    });

    // Map scroll position within the section to a point in the video timeline
    function getScrollProgress() {
      const rect = section.getBoundingClientRect();
      const scrollable = section.offsetHeight - window.innerHeight;
      // How far we've scrolled into the section (0 → 1)
      const scrolled = Math.min(Math.max(-rect.top, 0), scrollable);
      return scrollable > 0 ? scrolled / scrollable : 0;
    }

    function onScroll() {
      if (!videoReady || !isFinite(video.duration)) return;
      const p = getScrollProgress();
      targetTime = p * video.duration;

      // Update progress bar + fade scroll hint
      progress.style.width = (p * 100) + '%';
      hint.style.opacity = p > 0.02 ? 0 : 1;
    }

    // Smoothly ease the video toward the target time for buttery scrubbing.
    // Setting currentTime directly on every scroll event can stutter; lerping smooths it.
    function tick() {
      if (videoReady && isFinite(video.duration)) {
        currentTime += (targetTime - currentTime) * 0.12; // easing factor
        if (Math.abs(targetTime - currentTime) < 0.01) currentTime = targetTime;
        // Only set if meaningfully different to avoid decode thrash
        if (Math.abs(video.currentTime - currentTime) > 0.01) {
          video.currentTime = currentTime;
        }
      }
      requestAnimationFrame(tick);
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    requestAnimationFrame(tick);
    onScroll();
  </script>
</body>
</html>
