<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection — HM Watches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold:  #c9a84c;
      --gold2: #e8c97a;
      --black: #070604;
      --deep:  #0c0b09;
      --white: #f0ede8;
      --gray:  #7a7874;
      --card:  #0f0e0c;
      --border: rgba(201,168,76,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Courier Prime', monospace;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── NAV ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      padding: 1.6rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(7,6,4,0.95) 0%, transparent 100%);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--white);
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-logo:hover { color: var(--gold); }

    .nav-links {
      display: flex;
      gap: 2.2rem;
      list-style: none;
      pointer-events: auto;
    }

    .nav-links a {
      color: var(--gray);
      text-decoration: none;
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-links a.active { color: var(--gold); }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 14rem 3rem 5rem;
      border-bottom: 1px solid var(--border);
    }

    .page-header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--white);
      line-height: 1;
    }

    .page-header h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .header-meta {
      text-align: right;
    }

    .header-meta p {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gray);
      line-height: 2;
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 2rem 3rem;
      border-bottom: 1px solid var(--border);
    }

    .filter-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gray);
      margin-right: 0.5rem;
    }

    .filter-btn {
      background: none;
      border: 1px solid #1e1d1a;
      color: var(--gray);
      font-family: 'Courier Prime', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-sep {
      width: 1px;
      height: 1.2rem;
      background: #1e1d1a;
      margin: 0 0.5rem;
    }

    .sort-select {
      margin-left: auto;
      background: none;
      border: 1px solid #1e1d1a;
      color: var(--gray);
      font-family: 'Courier Prime', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .sort-select:focus { outline: none; border-color: var(--gold); }
    .sort-select option { background: #0f0e0c; color: var(--white); }

    /* ── GRID ── */
    .collection-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 3rem 8rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2px;
    }

    /* ── WATCH CARD ── */
    .watch-card {
      background: var(--card);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .watch-card:hover { transform: translateY(-4px); }
    .watch-card[data-status="sold"] { opacity: 0.6; }

    /* sold overlay */
    .watch-card[data-status="sold"]::after {
      content: 'SOLD';
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(7,6,4,0.85);
      border: 1px solid #3a3835;
      color: var(--gray);
      font-size: 0.5rem;
      letter-spacing: 0.35em;
      padding: 0.35rem 0.7rem;
      z-index: 10;
    }

    /* available badge */
    .watch-card[data-status="available"] .status-badge {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.35);
      color: var(--gold);
      font-size: 0.5rem;
      letter-spacing: 0.35em;
      padding: 0.35rem 0.7rem;
      z-index: 10;
    }

    /* photo */
    .card-photo {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0a0908;
      position: relative;
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
    }

    .watch-card:hover .card-photo img { transform: scale(1.04); }

    /* photo count indicator */
    .photo-count {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      font-size: 0.5rem;
      letter-spacing: 0.25em;
      color: rgba(240,237,232,0.5);
      background: rgba(7,6,4,0.6);
      padding: 0.25rem 0.6rem;
    }

    /* card body */
    .card-body {
      padding: 1.6rem 1.8rem 1.8rem;
      border-top: 1px solid var(--border);
    }

    .card-brand {
      font-size: 0.5rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .card-model {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--white);
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }

    .card-ref {
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      color: var(--gray);
      margin-bottom: 1.2rem;
    }

    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1rem;
      margin-bottom: 1.6rem;
    }

    .card-detail {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .detail-label {
      font-size: 0.45rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gray);
    }

    .detail-value {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--white);
    }

    .card-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--gold2);
      margin-bottom: 1.4rem;
      letter-spacing: 0.04em;
    }

    .card-price span {
      font-family: 'Courier Prime', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--gray);
      margin-left: 0.4rem;
    }

    .card-actions {
      display: flex;
      gap: 0.8rem;
    }

    .btn-inquire {
      flex: 1;
      background: none;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Courier Prime', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-inquire:hover {
      background: var(--gold);
      color: var(--black);
    }

    .btn-inquire.sold {
      border-color: #2a2a27;
      color: var(--gray);
      pointer-events: none;
    }

    .btn-view {
      background: none;
      border: 1px solid #1e1d1a;
      color: var(--gray);
      font-family: 'Courier Prime', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }

    .btn-view:hover { border-color: var(--gold); color: var(--gold); }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(7,6,4,0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lb-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .lb-img-wrap {
      position: relative;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-img-wrap img {
      max-width: 85vw;
      max-height: 75vh;
      object-fit: contain;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid #2a2a27;
      color: var(--gray);
      font-size: 1rem;
      width: 2.8rem;
      height: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }

    .lb-nav:hover { border-color: var(--gold); color: var(--gold); }
    .lb-prev { left: -4rem; }
    .lb-next { right: -4rem; }

    .lb-meta {
      text-align: center;
    }

    .lb-brand {
      font-size: 0.5rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.3rem;
    }

    .lb-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--white);
      letter-spacing: 0.05em;
    }

    .lb-counter {
      font-size: 0.5rem;
      letter-spacing: 0.25em;
      color: var(--gray);
      margin-top: 0.4rem;
    }

    .lb-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: 1px solid #2a2a27;
      color: var(--gray);
      font-size: 0.8rem;
      width: 2.4rem;
      height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }

    .lb-close:hover { border-color: var(--gold); color: var(--gold); }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 8rem 0;
      text-align: center;
    }

    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      font-style: italic;
      color: var(--gray);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 3rem;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer p {
      font-size: 0.5rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gray);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      #nav { padding: 1.2rem 1.5rem; }
      .page-header { padding: 10rem 1.5rem 3rem; }
      .page-header-inner { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .header-meta { text-align: left; }
      .filter-bar { padding: 1.5rem; }
      .collection-grid { padding: 3rem 1.5rem 6rem; grid-template-columns: 1fr 1fr; gap: 2px; }
      .lb-prev { left: -2.5rem; }
      .lb-next { right: -2.5rem; }
    }

    @media (max-width: 480px) {
      .collection-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="index.html">HM Watches</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="collection.html" class="active">Collection</a></li>
      <li><a href="index.html#stop-about">About</a></li>
      <li><a href="index.html#stop-appointment">Appointment</a></li>
    </ul>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <div class="page-header-inner">
      <h1>The <em>Collection</em></h1>
      <div class="header-meta">
        <p>Dubai, UAE</p>
        <p>Pre-owned · Certified</p>
        <p id="count-label">— pieces</p>
      </div>
    </div>
  </header>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="filter-bar-inner">
      <span class="filter-label">Brand</span>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Rolex">Rolex</button>
      <button class="filter-btn" data-filter="Audemars Piguet">AP</button>
      <button class="filter-btn" data-filter="Patek Philippe">Patek</button>
      <button class="filter-btn" data-filter="Richard Mille">RM</button>
      <div class="filter-sep"></div>
      <button class="filter-btn" data-filter="available" data-type="status">Available</button>
      <select class="sort-select" id="sort-select">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="year-desc">Year: Newest</option>
      </select>
    </div>
  </div>

  <!-- GRID -->
  <main>
    <div class="collection-grid" id="grid"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2024 HM Watches — Dubai</p>
    <p>All pieces verified. Inquiries by appointment.</p>
  </footer>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button class="lb-close" id="lb-close">✕</button>
    <div class="lb-inner">
      <div class="lb-img-wrap">
        <button class="lb-nav lb-prev" id="lb-prev">‹</button>
        <img id="lb-img" src="" alt="" />
        <button class="lb-nav lb-next" id="lb-next">›</button>
      </div>
      <div class="lb-meta">
        <div class="lb-brand" id="lb-brand"></div>
        <div class="lb-title" id="lb-title"></div>
        <div class="lb-counter" id="lb-counter"></div>
      </div>
    </div>
  </div>

  <script>
    /* ── DATA ─────────────────────────────────────────────────────────────── */
    /* Replace with API/Supabase fetch when backend is ready.                 */
    const WATCHES = [
      {
        id: 1,
        brand: "Richard Mille",
        model: "RM 67-02",
        ref: "RM 67-02",
        year: 2022,
        case: "Carbon TPT",
        dial: "Skeleton",
        price: 195000,
        currency: "USD",
        status: "available",
        photos: [
          "assets/images/placeholder-rm6702-1.jpg",
          "assets/images/placeholder-rm6702-2.jpg"
        ]
      },
      {
        id: 2,
        brand: "Rolex",
        model: "Daytona",
        ref: "116500LN",
        year: 2021,
        case: "Oystersteel",
        dial: "Black Ceramic Bezel",
        price: 38000,
        currency: "USD",
        status: "available",
        photos: [
          "assets/images/placeholder-daytona-1.jpg"
        ]
      },
      {
        id: 3,
        brand: "Audemars Piguet",
        model: "Royal Oak",
        ref: "15500ST.OO.1220ST.01",
        year: 2023,
        case: "Steel",
        dial: "Blue",
        price: 58000,
        currency: "USD",
        status: "available",
        photos: [
          "assets/images/placeholder-ro-1.jpg"
        ]
      },
      {
        id: 4,
        brand: "Patek Philippe",
        model: "Nautilus",
        ref: "5711/1A-010",
        year: 2020,
        case: "Steel",
        dial: "Blue Sunburst",
        price: 145000,
        currency: "USD",
        status: "sold",
        photos: [
          "assets/images/placeholder-nautilus-1.jpg"
        ]
      },
      {
        id: 5,
        brand: "Rolex",
        model: "Submariner",
        ref: "126610LN",
        year: 2022,
        case: "Oystersteel",
        dial: "Black",
        price: 18500,
        currency: "USD",
        status: "available",
        photos: [
          "assets/images/placeholder-sub-1.jpg"
        ]
      },
      {
        id: 6,
        brand: "Audemars Piguet",
        model: "Royal Oak Offshore",
        ref: "26400RO.OO.A002CA.01",
        year: 2019,
        case: "Rose Gold",
        dial: "Slate",
        price: 88000,
        currency: "USD",
        status: "available",
        photos: [
          "assets/images/placeholder-roo-1.jpg"
        ]
      }
    ];

    /* ── STATE ──────────────────────────────────────────────────────────────*/
    let activeFilter = "all";
    let activeSort   = "default";
    let lbWatch      = null;
    let lbIndex      = 0;

    /* ── UTILS ──────────────────────────────────────────────────────────────*/
    function formatPrice(price, currency) {
      if (!price) return "POA";
      return currency + " " + price.toLocaleString("en-US");
    }

    /* Fallback placeholder image if asset not found */
    function imgSrc(path) { return path; }

    /* ── RENDER ─────────────────────────────────────────────────────────────*/
    function filtered() {
      let list = [...WATCHES];

      if (activeFilter === "available") {
        list = list.filter(w => w.status === "available");
      } else if (activeFilter !== "all") {
        list = list.filter(w => w.brand === activeFilter);
      }

      if (activeSort === "price-asc")  list.sort((a,b) => (a.price||0) - (b.price||0));
      if (activeSort === "price-desc") list.sort((a,b) => (b.price||0) - (a.price||0));
      if (activeSort === "year-desc")  list.sort((a,b) => (b.year||0) - (a.year||0));

      return list;
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      const list = filtered();

      document.getElementById("count-label").textContent =
        list.length + " piece" + (list.length !== 1 ? "s" : "");

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No pieces match the current filter.</p></div>`;
        return;
      }

      grid.innerHTML = list.map(w => {
        const sold = w.status === "sold";
        const mainPhoto = w.photos && w.photos[0] ? w.photos[0] : "";
        const photoCount = w.photos ? w.photos.length : 0;

        return `
        <article class="watch-card" data-status="${w.status}" data-id="${w.id}">
          ${!sold ? `<div class="status-badge">Available</div>` : ""}
          <div class="card-photo" data-action="lightbox">
            ${mainPhoto
              ? `<img src="${mainPhoto}" alt="${w.brand} ${w.model}"
                   onerror="this.style.opacity='0'" loading="lazy" />`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;
                  justify-content:center;color:var(--gray);font-size:0.5rem;
                  letter-spacing:0.3em;text-transform:uppercase;">No Photo</div>`
            }
            ${photoCount > 1
              ? `<div class="photo-count">${photoCount} photos</div>`
              : ""}
          </div>
          <div class="card-body">
            <div class="card-brand">${w.brand}</div>
            <div class="card-model">${w.model}</div>
            <div class="card-ref">Ref. ${w.ref}</div>
            <div class="card-details">
              <div class="card-detail">
                <span class="detail-label">Year</span>
                <span class="detail-value">${w.year || "—"}</span>
              </div>
              <div class="card-detail">
                <span class="detail-label">Case</span>
                <span class="detail-value">${w.case || "—"}</span>
              </div>
              <div class="card-detail">
                <span class="detail-label">Dial</span>
                <span class="detail-value">${w.dial || "—"}</span>
              </div>
              <div class="card-detail">
                <span class="detail-label">Status</span>
                <span class="detail-value">${sold ? "Sold" : "Available"}</span>
              </div>
            </div>
            <div class="card-price">
              ${formatPrice(w.price, w.currency)}
              ${w.price ? "" : `<span>Price on application</span>`}
            </div>
            <div class="card-actions">
              ${sold
                ? `<button class="btn-inquire sold">Sold</button>`
                : `<a class="btn-inquire" href="https://wa.me/971000000000?text=I'm%20interested%20in%20the%20${encodeURIComponent(w.brand + ' ' + w.model + ' Ref. ' + w.ref)}" target="_blank" rel="noopener">
                     Inquire via WhatsApp
                   </a>`
              }
              ${w.photos && w.photos.length > 0
                ? `<button class="btn-view" data-action="lightbox">Photos</button>`
                : ""
              }
            </div>
          </div>
        </article>`;
      }).join("");

      /* attach lightbox triggers */
      grid.querySelectorAll("[data-action='lightbox']").forEach(el => {
        el.addEventListener("click", e => {
          const card = e.currentTarget.closest(".watch-card");
          if (!card) return;
          const id = parseInt(card.dataset.id);
          openLightbox(id, 0);
        });
      });
    }

    /* ── LIGHTBOX ───────────────────────────────────────────────────────────*/
    function openLightbox(watchId, photoIndex) {
      lbWatch = WATCHES.find(w => w.id === watchId);
      if (!lbWatch || !lbWatch.photos || lbWatch.photos.length === 0) return;
      lbIndex = photoIndex;
      renderLightbox();
      document.getElementById("lightbox").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
      document.body.style.overflow = "";
      lbWatch = null;
    }

    function renderLightbox() {
      if (!lbWatch) return;
      document.getElementById("lb-img").src = lbWatch.photos[lbIndex];
      document.getElementById("lb-img").alt = `${lbWatch.brand} ${lbWatch.model}`;
      document.getElementById("lb-brand").textContent = lbWatch.brand;
      document.getElementById("lb-title").textContent = `${lbWatch.model} — Ref. ${lbWatch.ref}`;
      const total = lbWatch.photos.length;
      document.getElementById("lb-counter").textContent =
        total > 1 ? `${lbIndex + 1} / ${total}` : "";
      document.getElementById("lb-prev").style.display = total > 1 ? "" : "none";
      document.getElementById("lb-next").style.display = total > 1 ? "" : "none";
    }

    document.getElementById("lb-close").addEventListener("click", closeLightbox);

    document.getElementById("lb-prev").addEventListener("click", () => {
      if (!lbWatch) return;
      lbIndex = (lbIndex - 1 + lbWatch.photos.length) % lbWatch.photos.length;
      renderLightbox();
    });

    document.getElementById("lb-next").addEventListener("click", () => {
      if (!lbWatch) return;
      lbIndex = (lbIndex + 1) % lbWatch.photos.length;
      renderLightbox();
    });

    document.getElementById("lightbox").addEventListener("click", e => {
      if (e.target === document.getElementById("lightbox")) closeLightbox();
    });

    document.addEventListener("keydown", e => {
      if (!document.getElementById("lightbox").classList.contains("open")) return;
      if (e.key === "Escape")      closeLightbox();
      if (e.key === "ArrowLeft")   { lbIndex = (lbIndex - 1 + lbWatch.photos.length) % lbWatch.photos.length; renderLightbox(); }
      if (e.key === "ArrowRight")  { lbIndex = (lbIndex + 1) % lbWatch.photos.length; renderLightbox(); }
    });

    /* ── FILTERS ────────────────────────────────────────────────────────────*/
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    document.getElementById("sort-select").addEventListener("change", e => {
      activeSort = e.target.value;
      renderGrid();
    });

    /* ── INIT ───────────────────────────────────────────────────────────────*/
    renderGrid();
  </script>

</body>
</html>
